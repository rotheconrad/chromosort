<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Missing coverage or large gap</title>
  <desc id="desc">A forward alignment is interrupted by a blank reference interval and resumes later.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="88" y="54" width="650" height="280" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <rect x="354" y="54" width="98" height="280" fill="#f4b400" opacity="0.14"/>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="218" y1="54" x2="218" y2="334"/>
    <line x1="348" y1="54" x2="348" y2="334"/>
    <line x1="478" y1="54" x2="478" y2="334"/>
    <line x1="608" y1="54" x2="608" y2="334"/>
    <line x1="88" y1="124" x2="738" y2="124"/>
    <line x1="88" y1="194" x2="738" y2="194"/>
    <line x1="88" y1="264" x2="738" y2="264"/>
  </g>
  <line x1="88" y1="334" x2="754" y2="334" stroke="#202124" stroke-width="2"/>
  <line x1="88" y1="334" x2="88" y2="40" stroke="#202124" stroke-width="2"/>
  <line x1="125" y1="306" x2="330" y2="218" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="468" y1="164" x2="708" y2="62" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#5f6368" stroke-width="1.3" stroke-dasharray="6 6" fill="none">
    <path d="M330 218 C365 210 424 183 468 164"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="108" y="34" font-size="16" font-weight="700">Blank interval interrupts an otherwise clean match</text>
    <text x="333" y="382" font-size="15">reference chr1 position</text>
    <text x="-245" y="28" transform="rotate(-90)" font-size="15">query contig position</text>
    <text x="360" y="86" font-size="13" fill="#5f6368">uncovered or filtered</text>
    <text x="360" y="104" font-size="13" fill="#5f6368">reference interval</text>
    <text x="104" y="364" font-size="13" fill="#5f6368">Interpretation: gap, divergence, repeat, filter effect, or true presence/absence variation.</text>
  </g>
</svg>

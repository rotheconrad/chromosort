<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Internal inversion pattern</title>
  <desc id="desc">Forward flanking segments surround a reverse-strand segment in the middle of one contig.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="88" y="54" width="650" height="280" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="218" y1="54" x2="218" y2="334"/>
    <line x1="348" y1="54" x2="348" y2="334"/>
    <line x1="478" y1="54" x2="478" y2="334"/>
    <line x1="608" y1="54" x2="608" y2="334"/>
    <line x1="88" y1="124" x2="738" y2="124"/>
    <line x1="88" y1="194" x2="738" y2="194"/>
    <line x1="88" y1="264" x2="738" y2="264"/>
  </g>
  <line x1="88" y1="334" x2="754" y2="334" stroke="#202124" stroke-width="2"/>
  <line x1="88" y1="334" x2="88" y2="40" stroke="#202124" stroke-width="2"/>
  <line x1="126" y1="306" x2="282" y2="244" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="172" x2="440" y2="230" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <line x1="458" y1="156" x2="708" y2="66" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#5f6368" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="292" y1="58" x2="292" y2="332"/>
    <line x1="448" y1="58" x2="448" y2="332"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="108" y="34" font-size="16" font-weight="700">Forward flanks with a reverse internal block</text>
    <text x="333" y="382" font-size="15">reference chr1 position</text>
    <text x="-245" y="28" transform="rotate(-90)" font-size="15">query contig position</text>
    <text x="318" y="95" font-size="13" fill="#5f6368">candidate inversion interval</text>
    <text x="104" y="364" font-size="13" fill="#5f6368">Interpretation: inversion, local orientation error, or reference difference.</text>
  </g>
  <path d="M385 101 C386 132 382 160 371 197" stroke="#5f6368" stroke-width="1.3" fill="none"/>
</svg>

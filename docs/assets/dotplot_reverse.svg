<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Reverse-complemented contig</title>
  <desc id="desc">A single long reverse-strand alignment slopes downward across the dot plot.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="88" y="54" width="650" height="280" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="218" y1="54" x2="218" y2="334"/>
    <line x1="348" y1="54" x2="348" y2="334"/>
    <line x1="478" y1="54" x2="478" y2="334"/>
    <line x1="608" y1="54" x2="608" y2="334"/>
    <line x1="88" y1="124" x2="738" y2="124"/>
    <line x1="88" y1="194" x2="738" y2="194"/>
    <line x1="88" y1="264" x2="738" y2="264"/>
  </g>
  <line x1="88" y1="334" x2="754" y2="334" stroke="#202124" stroke-width="2"/>
  <line x1="88" y1="334" x2="88" y2="40" stroke="#202124" stroke-width="2"/>
  <line x1="140" y1="86" x2="705" y2="306" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="108" y="34" font-size="16" font-weight="700">Reverse orientation: one coherent red block</text>
    <text x="333" y="382" font-size="15">reference chr1 position</text>
    <text x="-245" y="28" transform="rotate(-90)" font-size="15">query contig position</text>
    <text x="515" y="96" font-size="13" fill="#5f6368">Reference coordinate increases</text>
    <text x="520" y="116" font-size="13" fill="#5f6368">while query coordinate decreases.</text>
    <text x="105" y="364" font-size="13" fill="#5f6368">Interpretation: often an orientation issue, not a misjoin.</text>
  </g>
  <path d="M500 122 C455 148 410 167 355 174" stroke="#5f6368" stroke-width="1.3" fill="none"/>
  <rect x="765" y="148" width="105" height="52" rx="4" fill="#ffffff" stroke="#d7d7d0"/>
  <text x="778" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202124">Reverse</text>
  <text x="778" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202124">complement</text>
</svg>

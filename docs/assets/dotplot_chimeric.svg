<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Multi-reference or chimeric contig</title>
  <desc id="desc">One query contig has strong alignment blocks on two different reference chromosomes.</desc>
  <rect width="900" height="440" fill="#ffffff"/>
  <rect x="90" y="60" width="660" height="290" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <line x1="420" y1="60" x2="420" y2="350" stroke="#bdbdb7" stroke-width="2"/>
  <text x="210" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#202124">ref chr1</text>
  <text x="542" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#202124">ref chr8</text>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="200" y1="60" x2="200" y2="350"/>
    <line x1="310" y1="60" x2="310" y2="350"/>
    <line x1="530" y1="60" x2="530" y2="350"/>
    <line x1="640" y1="60" x2="640" y2="350"/>
    <line x1="90" y1="132" x2="750" y2="132"/>
    <line x1="90" y1="205" x2="750" y2="205"/>
    <line x1="90" y1="278" x2="750" y2="278"/>
  </g>
  <line x1="90" y1="350" x2="765" y2="350" stroke="#202124" stroke-width="2"/>
  <line x1="90" y1="350" x2="90" y2="46" stroke="#202124" stroke-width="2"/>
  <g stroke="#2563eb" stroke-width="8" stroke-linecap="round">
    <line x1="125" y1="312" x2="318" y2="228"/>
    <line x1="490" y1="202" x2="705" y2="102"/>
  </g>
  <line x1="342" y1="219" x2="468" y2="207" stroke="#8a8f98" stroke-width="2.5" stroke-dasharray="7 7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="110" y="35" font-size="16" font-weight="700">One query contig, two distant reference blocks</text>
    <text x="322" y="400" font-size="15">reference sequences on x-axis</text>
    <text x="-260" y="30" transform="rotate(-90)" font-size="15">one query contig coordinate</text>
    <text x="540" y="252" font-size="13" fill="#5f6368">Possible split candidate,</text>
    <text x="540" y="270" font-size="13" fill="#5f6368">translocation, or repeat.</text>
    <text x="108" y="378" font-size="13" fill="#5f6368">Interpretation needs alignment metrics and biological context.</text>
  </g>
  <path d="M536 246 C496 230 460 215 420 210" stroke="#5f6368" stroke-width="1.3" fill="none"/>
</svg>

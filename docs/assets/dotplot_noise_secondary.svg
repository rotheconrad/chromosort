<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Off-target speckles and secondary hits</title>
  <desc id="desc">A strong main alignment appears with many shorter weaker scattered hits.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="88" y="54" width="650" height="280" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="218" y1="54" x2="218" y2="334"/>
    <line x1="348" y1="54" x2="348" y2="334"/>
    <line x1="478" y1="54" x2="478" y2="334"/>
    <line x1="608" y1="54" x2="608" y2="334"/>
    <line x1="88" y1="124" x2="738" y2="124"/>
    <line x1="88" y1="194" x2="738" y2="194"/>
    <line x1="88" y1="264" x2="738" y2="264"/>
  </g>
  <line x1="88" y1="334" x2="754" y2="334" stroke="#202124" stroke-width="2"/>
  <line x1="88" y1="334" x2="88" y2="40" stroke="#202124" stroke-width="2"/>
  <line x1="170" y1="292" x2="610" y2="105" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <g stroke-linecap="round" opacity="0.42">
    <line x1="120" y1="114" x2="150" y2="100" stroke="#2563eb" stroke-width="3"/>
    <line x1="210" y1="88" x2="245" y2="74" stroke="#dc2626" stroke-width="3"/>
    <line x1="280" y1="284" x2="312" y2="270" stroke="#2563eb" stroke-width="3"/>
    <line x1="385" y1="92" x2="420" y2="78" stroke="#2563eb" stroke-width="3"/>
    <line x1="510" y1="302" x2="552" y2="285" stroke="#dc2626" stroke-width="3"/>
    <line x1="628" y1="245" x2="690" y2="220" stroke="#2563eb" stroke-width="3"/>
    <line x1="142" y1="222" x2="188" y2="205" stroke="#dc2626" stroke-width="3"/>
    <line x1="575" y1="156" x2="636" y2="130" stroke="#2563eb" stroke-width="3"/>
    <line x1="330" y1="150" x2="362" y2="136" stroke="#2563eb" stroke-width="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="108" y="34" font-size="16" font-weight="700">Strong main block plus short scattered hits</text>
    <text x="333" y="382" font-size="15">reference position</text>
    <text x="-245" y="28" transform="rotate(-90)" font-size="15">query position</text>
    <text x="636" y="94" font-size="13" fill="#5f6368">dominant placement</text>
    <text x="606" y="266" font-size="13" fill="#5f6368">short off-target hits</text>
    <text x="104" y="364" font-size="13" fill="#5f6368">Interpretation: usually repeat-like signal unless short hits are long, unique, and supported.</text>
  </g>
  <path d="M635 96 C617 95 604 100 610 105" stroke="#5f6368" stroke-width="1.3" fill="none"/>
  <path d="M600 262 C576 255 566 245 556 230" stroke="#5f6368" stroke-width="1.3" fill="none"/>
</svg>

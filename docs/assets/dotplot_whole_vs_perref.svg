<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Whole-genome versus per-reference dot plots</title>
  <desc id="desc">Side-by-side cartoon comparing a compressed whole-genome dot plot with a clearer per-reference view, both labeled with query contig rows.</desc>
  <rect width="900" height="440" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202124">
    <text x="95" y="38" font-size="16" font-weight="700">Whole-genome view</text>
    <text x="525" y="38" font-size="16" font-weight="700">Per-reference view</text>
  </g>
  <rect x="78" y="70" width="330" height="260" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <rect x="508" y="70" width="330" height="260" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <g stroke="#bdbdb7" stroke-width="1.5">
    <line x1="188" y1="70" x2="188" y2="330"/>
    <line x1="298" y1="70" x2="298" y2="330"/>
  </g>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="78" y1="130" x2="408" y2="130"/>
    <line x1="78" y1="200" x2="408" y2="200"/>
    <line x1="78" y1="270" x2="408" y2="270"/>
    <line x1="591" y1="70" x2="591" y2="330"/>
    <line x1="674" y1="70" x2="674" y2="330"/>
    <line x1="756" y1="70" x2="756" y2="330"/>
    <line x1="508" y1="130" x2="838" y2="130"/>
    <line x1="508" y1="200" x2="838" y2="200"/>
    <line x1="508" y1="270" x2="838" y2="270"/>
  </g>
  <g stroke="#b7b7af" stroke-width="1.2" stroke-dasharray="6 5">
    <line x1="78" y1="158" x2="408" y2="158"/>
    <line x1="78" y1="244" x2="408" y2="244"/>
    <line x1="508" y1="158" x2="838" y2="158"/>
    <line x1="508" y1="244" x2="838" y2="244"/>
  </g>
  <g stroke="#202124" stroke-width="2">
    <line x1="78" y1="330" x2="420" y2="330"/>
    <line x1="78" y1="330" x2="78" y2="56"/>
    <line x1="508" y1="330" x2="850" y2="330"/>
    <line x1="508" y1="330" x2="508" y2="56"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#5f6368" font-size="12">
    <text x="25" y="304">contig A</text>
    <text x="25" y="216">contig B</text>
    <text x="25" y="126">contig C</text>
    <text x="455" y="304">contig A</text>
    <text x="455" y="216">contig B</text>
    <text x="455" y="126">contig C</text>
  </g>
  <rect x="650" y="70" width="70" height="260" fill="#f4b400" opacity="0.12"/>
  <g stroke-linecap="round">
    <line x1="98" y1="304" x2="170" y2="280" stroke="#2563eb" stroke-width="6"/>
    <line x1="210" y1="252" x2="275" y2="226" stroke="#2563eb" stroke-width="6"/>
    <line x1="320" y1="206" x2="390" y2="176" stroke="#2563eb" stroke-width="6"/>
    <line x1="100" y1="125" x2="150" y2="102" stroke="#dc2626" stroke-width="4" opacity="0.6"/>
    <line x1="326" y1="290" x2="382" y2="266" stroke="#2563eb" stroke-width="3" opacity="0.5"/>
    <line x1="535" y1="304" x2="620" y2="266" stroke="#2563eb" stroke-width="7"/>
    <line x1="637" y1="202" x2="702" y2="232" stroke="#dc2626" stroke-width="7"/>
    <line x1="718" y1="170" x2="815" y2="126" stroke="#2563eb" stroke-width="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#5f6368" font-size="13">
    <text x="105" y="356">ref chr1</text>
    <text x="215" y="356">ref chr2</text>
    <text x="323" y="356">ref chr3</text>
    <text x="602" y="356">one selected reference</text>
    <text x="88" y="386">Best for global placement and cross-reference jumps.</text>
    <text x="528" y="386">Best for local orientation, gaps, and overlaps.</text>
    <text x="658" y="102">local detail</text>
  </g>
</svg>

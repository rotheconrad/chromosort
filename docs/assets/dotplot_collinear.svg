<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Clean collinear placement</title>
  <desc id="desc">Three forward-strand query contigs align in order along one reference chromosome.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="86" y="54" width="664" height="280" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="220" y1="54" x2="220" y2="334"/>
    <line x1="352" y1="54" x2="352" y2="334"/>
    <line x1="485" y1="54" x2="485" y2="334"/>
    <line x1="618" y1="54" x2="618" y2="334"/>
    <line x1="86" y1="124" x2="750" y2="124"/>
    <line x1="86" y1="194" x2="750" y2="194"/>
    <line x1="86" y1="264" x2="750" y2="264"/>
  </g>
  <line x1="86" y1="334" x2="765" y2="334" stroke="#202124" stroke-width="2"/>
  <line x1="86" y1="334" x2="86" y2="40" stroke="#202124" stroke-width="2"/>
  <text x="338" y="382" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#202124">reference chr1 position</text>
  <text x="-246" y="28" transform="rotate(-90)" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#202124">query contig position</text>
  <g stroke="#2563eb" stroke-width="8" stroke-linecap="round">
    <line x1="118" y1="304" x2="268" y2="238"/>
    <line x1="305" y1="220" x2="500" y2="135"/>
    <line x1="535" y1="118" x2="710" y2="70"/>
  </g>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.5">
    <rect x="780" y="72" width="86" height="32" rx="4"/>
    <rect x="780" y="146" width="86" height="32" rx="4"/>
    <rect x="780" y="248" width="86" height="32" rx="4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202124">
    <text x="796" y="93">contig C</text>
    <text x="796" y="167">contig B</text>
    <text x="796" y="269">contig A</text>
    <text x="103" y="34" font-size="16" font-weight="700">Clean pattern: ordered forward blocks</text>
    <text x="102" y="363" fill="#5f6368">Interpretation: broad synteny, likely good candidates for sorting and scaffolding.</text>
  </g>
  <g stroke="#5f6368" stroke-width="1.3" fill="none">
    <path d="M780 88 C754 86 735 78 710 70"/>
    <path d="M780 162 C715 151 592 145 500 135"/>
    <path d="M780 264 C560 286 302 270 268 238"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Clean collinear placement</title>
  <desc id="desc">Three forward-strand query contigs align in order along one labeled reference chromosome, with horizontal query-contig boundaries.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="150" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#202124">Clean pattern: ordered forward blocks</text>
  <g stroke="#202124" stroke-width="1.8">
    <line x1="150" y1="54" x2="720" y2="54"/>
    <line x1="150" y1="48" x2="150" y2="60"/>
    <line x1="340" y1="48" x2="340" y2="60"/>
    <line x1="530" y1="48" x2="530" y2="60"/>
    <line x1="720" y1="48" x2="720" y2="60"/>
  </g>
  <text x="435" y="49" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202124" text-anchor="middle">reference chromosome chr1</text>
  <rect x="150" y="72" width="570" height="250" fill="#fbfbf8" stroke="#d7d7d0" stroke-width="1.5"/>
  <g stroke="#e6e6df" stroke-width="1">
    <line x1="292" y1="72" x2="292" y2="322"/>
    <line x1="435" y1="72" x2="435" y2="322"/>
    <line x1="577" y1="72" x2="577" y2="322"/>
    <line x1="150" y1="114" x2="720" y2="114"/>
    <line x1="150" y1="196" x2="720" y2="196"/>
    <line x1="150" y1="280" x2="720" y2="280"/>
  </g>
  <g stroke="#b7b7af" stroke-width="1.3" stroke-dasharray="6 5">
    <line x1="150" y1="155" x2="720" y2="155"/>
    <line x1="150" y1="238" x2="720" y2="238"/>
  </g>
  <g stroke="#202124" stroke-width="2">
    <line x1="150" y1="322" x2="734" y2="322"/>
    <line x1="150" y1="322" x2="150" y2="62"/>
  </g>
  <g fill="#5f6368" font-family="Arial, Helvetica, sans-serif" font-size="12">
    <text x="142" y="344">0 Mb</text>
    <text x="316" y="344">50 Mb</text>
    <text x="492" y="344">100 Mb</text>
    <text x="666" y="344">150 Mb</text>
    <text x="75" y="285">contig A</text>
    <text x="75" y="205">contig B</text>
    <text x="75" y="123">contig C</text>
  </g>
  <text x="435" y="382" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#202124" text-anchor="middle">reference chr1 position</text>
  <text x="38" y="198" text-anchor="middle" transform="rotate(-90 38 198)" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#202124">query contig rows</text>
  <g stroke="#2563eb" stroke-width="8" stroke-linecap="round">
    <line x1="180" y1="294" x2="302" y2="260"/>
    <line x1="350" y1="220" x2="510" y2="176"/>
    <line x1="550" y1="147" x2="690" y2="112"/>
  </g>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.5">
    <rect x="760" y="98" width="92" height="32" rx="4"/>
    <rect x="760" y="164" width="92" height="32" rx="4"/>
    <rect x="760" y="248" width="92" height="32" rx="4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202124">
    <text x="777" y="119">contig C</text>
    <text x="777" y="185">contig B</text>
    <text x="777" y="269">contig A</text>
    <text x="150" y="362" fill="#5f6368">Dashed horizontal lines mark separate query contigs, not internal gaps.</text>
  </g>
  <g stroke="#5f6368" stroke-width="1.3" fill="none">
    <path d="M760 114 C738 113 714 112 690 112"/>
    <path d="M760 180 C700 178 590 177 510 176"/>
    <path d="M760 264 C610 290 380 284 302 260"/>
  </g>
</svg>

name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - docs/**
      - .github/workflows/ci.yml
      - .github/ISSUE_TEMPLATE/**
      - .github/copilot-instructions.md
      - .github/pull_request_template.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - JEWEL.md
      - JULES.md
      - Makefile
      - README.md
      - environment.yml
      - pixi.toml
      - pyproject.toml
  pull_request:
    paths:
      - src/**
      - tests/**
      - docs/**
      - .github/workflows/ci.yml
      - .github/ISSUE_TEMPLATE/**
      - .github/copilot-instructions.md
      - .github/pull_request_template.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - JEWEL.md
      - JULES.md
      - Makefile
      - README.md
      - environment.yml
      - pixi.toml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Check whitespace
        run: make diff-check

      - name: Lint
        run: make lint

      - name: Smoke CLI
        run: make smoke

      - name: Run tests
        run: make test

      - name: Package check
        run: make package-check

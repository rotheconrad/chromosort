[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromosort"
version = "0.3.0"
description = "Reference-order, clean, fix, cut, manually edit, scaffold, gapfill, plot, write AGP provenance sidecars, prepare all-mode eval tables and targeted GAF inputs, and review genome assembly contigs from MUMmer, minimap2, GFA, GAF, and Hi-C evidence."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
authors = [
  { name = "Conrad Roth" }
]
keywords = [
  "genomics",
  "assembly",
  "contigs",
  "MUMmer",
  "minimap2",
  "PAF",
  "nucmer",
  "reference-guided"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "Pillow>=9"
]

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=7",
  "ruff>=0.6"
]

[project.urls]
Homepage = "https://github.com/rotheconrad/chromosort"
Issues = "https://github.com/rotheconrad/chromosort/issues"

[project.scripts]
chromo = "chromosort.cli:main"
chromosort = "chromosort.reference_order:main"
chromosort-clean = "chromosort.clean:main"
chromosort-fix-contigs = "chromosort.fix_contigs:main"
chromosort-scaffold = "chromosort.scaffold:main"
chromosort-gapfill = "chromosort.gapfill:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [
  "_site",
  "docs/_site",
  "temp",
  "vendor"
]

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromosort"
version = "0.2.23"
description = "Reference-order, fix, cut, manually edit, scaffold, gapfill, plot, and review genome assembly contigs from MUMmer, minimap2, GFA, GAF, and Hi-C evidence."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Conrad Roth" }
]
keywords = [
  "genomics",
  "assembly",
  "contigs",
  "MUMmer",
  "minimap2",
  "PAF",
  "nucmer",
  "reference-guided"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "Pillow>=9"
]

[project.urls]
Homepage = "https://github.com/rotheconrad/chromosort"
Issues = "https://github.com/rotheconrad/chromosort/issues"

[project.scripts]
chromo = "chromosort.cli:main"
chromosort = "chromosort.reference_order:main"
chromosort-fix-contigs = "chromosort.fix_contigs:main"
chromosort-scaffold = "chromosort.scaffold:main"
chromosort-gapfill = "chromosort.gapfill:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
